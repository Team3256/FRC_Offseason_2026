name: CI
on: push
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check C++ formatting (clang-format)
        run: |
          clang-format --version
          find src tools/desktop -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # This grabs the WPILib docker container
    container: wpilib/roborio-cross-ubuntu:2025-24.04

    steps:
      - uses: actions/checkout@v4

      # Declares the repository safe and not under dubious ownership.
      - name: Add repository to git safe directories
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install the roboRIO toolchain for this GradleRIO version
        run: ./gradlew installRoboRioToolchain

      # Compiles for the roboRIO and the desktop, and runs every unit and simulation test.
      - name: Build robot code and run tests
        run: ./gradlew build

  desktop-cmake:
    # Same code and tests through the stand-alone CMake build (tools/desktop), which uses the
    # RobotPy-packaged WPILib libraries; keeps that path working for machines without GradleRIO.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev cmake
      - name: Fetch desktop libraries
        run: ./tools/desktop/fetch_deps.sh
      - name: Build
        run: |
          cmake -S . -B build-desktop -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-desktop -j4
      - name: Test
        run: ctest --test-dir build-desktop --output-on-failure -j1
