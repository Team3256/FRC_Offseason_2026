name: Mayhem path previews

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/main/deploy/mayhem/**'
      - 'tools/path-previews/**'
      - '.github/workflows/mayhem-path-previews.yml'

permissions:
  contents: read

concurrency:
  group: mayhem-previews-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/path-previews/package-lock.json
      - name: Build Mayhem field renderer
        working-directory: tools/path-previews
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/path-previews/requirements.txt
      - name: Install renderer and pinned Mayhem solver
        run: python -m pip install -r tools/path-previews/requirements.txt
      - name: Check preview rendering and publishing logic
        run: |
          python -m unittest discover -s tools/path-previews -p 'test_*.py'
          node --test tools/path-previews/test_*.cjs
      - name: Render changed paths against the merge base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python tools/path-previews/render.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Save videos and report (including solve failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mayhem-path-previews
          path: path-previews/
          if-no-files-found: warn
          retention-days: 14
