plugins {
    id "cpp"
    id "google-test-test-suite"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
}

// Define my targets (RoboRIO) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            team = project.frc.getTeamNumber()
            debug = project.frc.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                frcCpp(getArtifactTypeClass('FRCNativeArtifact')) {
                }

                // Static files artifact
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/lvuser/deploy'
                    deleteOldFiles = false // Change to true to delete files on roboRIO that no
                    // longer exist in deploy directory of this project
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcCpp

// Set this to true to include the src folder in the include directories passed
// to the compiler. Some eclipse project imports depend on this behavior.
def includeSrcInIncludeRoot = false

// Desktop support: needed for `./gradlew simulateNative` and for the unit/simulation tests that
// `./gradlew build` and `./gradlew test` run.
def includeDesktopSupport = true

// Enable simulation gui support. Must check the box in vscode to enable support
// upon debugging
dependencies {
    simulationDebug wpi.sim.enableDebug()
    simulationRelease wpi.sim.enableRelease()
}

// Simulation configuration (e.g. environment variables).
wpi.sim.addGui().defaultEnabled = true
wpi.sim.addDriverstation()

model {
    components {
        frcUserProgram(NativeExecutableSpec) {
            targetPlatform wpi.platforms.roborio
            if (includeDesktopSupport) {
                targetPlatform wpi.platforms.desktop
            }

            sources.cpp {
                source {
                    srcDir 'src/main/cpp'
                    include '**/*.cpp', '**/*.cc'
                }
                exportedHeaders {
                    srcDir 'src/main/include'
                    if (includeSrcInIncludeRoot) {
                        srcDir 'src/main/cpp'
                    }
                }
            }

            // Set deploy task to deploy this component
            deployArtifact.component = it

            // Enable run tasks for this component
            wpi.cpp.enableExternalTasks(it)

            // Enable simulation for this component
            wpi.sim.enable(it)
            // Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
            wpi.cpp.vendor.cpp(it)
            wpi.cpp.deps.wpilib(it)
        }
    }
    testSuites {
        frcUserProgramTest(GoogleTestTestSuiteSpec) {
            testing $.components.frcUserProgram

            sources.cpp {
                source {
                    srcDir 'src/test/cpp'
                    include '**/*.cpp'
                }
                exportedHeaders {
                    srcDir 'src/test/include'
                }
            }

            binaries.all {
                // Robot.cpp/Main.cpp leave out main() for the test binary.
                cppCompiler.define 'RUNNING_FRC_TESTS'
            }

            // Enable run tasks for this component
            wpi.cpp.enableExternalTasks(it)

            wpi.cpp.vendor.cpp(it)
            wpi.cpp.deps.wpilib(it)
            wpi.cpp.deps.googleTest(it)
        }
    }
}

// Mayhem: record what is being built and deployed in deploy/mayhem-build.json (deployed to the
// roboRIO and logged at boot as Mayhem/Build), so the Mayhem app can show what's on the robot and
// each log says which code it ran. MAYHEM_BUILD_SHA/BRANCH override git (Mayhem's rollback builds a
// clean export of a commit).
task mayhemBuildStamp {
    outputs.upToDateWhen { false }
    doLast {
        def git = { List<String> args ->
            try {
                def p = (["git"] + args).execute(null, projectDir)
                def text = p.text
                p.waitFor() == 0 ? text : ""
            } catch (ignored) {
                ""
            }
        }
        def dirty = git(["status", "--porcelain"]).readLines().collect { it.length() > 3 ? it.substring(3) : it }
        def stamp = [
            sha     : System.getenv("MAYHEM_BUILD_SHA") ?: git(["rev-parse", "HEAD"]).trim(),
            branch  : System.getenv("MAYHEM_BUILD_BRANCH") ?: git(["rev-parse", "--abbrev-ref", "HEAD"]).trim(),
            dirty   : dirty.take(50),
            builtAt : new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX"),
            builtBy : System.getProperty("user.name"),
            computer: InetAddress.localHost.hostName,
        ]
        def out = file("src/main/deploy/mayhem-build.json")
        out.parentFile.mkdirs()
        out.text = groovy.json.JsonOutput.toJson(stamp) + "\n"
    }
}
tasks.withType(CppCompile).configureEach { dependsOn mayhemBuildStamp }

// Create commit with working changes on event branches
task(eventDeploy) {
    doLast {
        if (project.gradle.startParameter.taskNames.any({ it.toLowerCase().contains("deploy") })) {
            def branchPrefix = "event"
            def branch = 'git branch --show-current'.execute().text.trim()
            def commitMessage = "Update at '${new Date().toString()}'"

            if (branch.startsWith(branchPrefix)) {
                exec {
                    workingDir(projectDir)
                    executable 'git'
                    args 'add', '-A'
                }
                exec {
                    workingDir(projectDir)
                    executable 'git'
                    args 'commit', '-m', commitMessage
                    ignoreExitValue = true
                }

                println "Committed to branch: '$branch'"
                println "Commit message: '$commitMessage'"
            } else {
                println "Not on an event branch, skipping commit"
            }
        } else {
            println "Not running deploy task, skipping commit"
        }
    }
}
// (was hooked to gversion's createVersionFile in the Java build; now runs before compiling)
tasks.withType(CppCompile).configureEach { dependsOn eventDeploy }
